version: '3.8'
services:
  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: wppass
    volumes:
      - db_data_poc:/var/lib/mysql

  wordpress:
    build: .
    depends_on:
      - db
    ports:
      - "8082:80"        # chỉnh cổng khác so với site chính
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: wppass
      WORDPRESS_DB_NAME: wordpress
      XDEBUG_MODE: debug
    volumes:
      - ./wp_data:/var/www/html
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog
    ports:
      - "8026:8025"
      - "1026:1025"

volumes:
  db_data_poc:
